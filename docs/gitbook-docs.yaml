# ==============================================================================
# GitBook Documentation Configuration — Linguagem Verbo (cópia sincronizada)
# ==============================================================================
# Este arquivo está disponível diretamente na pasta docs/ para compatibilidade
# caso o GitBook aponte diretamente para o diretório docs/.
# ==============================================================================

site:
  title: "Linguagem Verbo"
  description: "A linguagem de programação transpilada para Go baseada na gramática da norma culta do Português Brasileiro."
  author: "Crom"
  language: "pt-BR"

root: "."
structure:
  readme: "README.md"
  summary: "SUMMARY.md"

gitbook: "5.x.x"

theme:
  colors:
    primary: "#009739"
    secondary: "#FFDF00"
    highlight: "#00ff88"

plugins:
  - prism
  - mermaid
  - search
  - anchorjs
  - copy-code-button

links:
  sidebar:
    "Repositório GitHub": "https://github.com/crom-org/verbo"
