# ==============================================================================
# GitBook Documentation Configuration — Linguagem Verbo
# ==============================================================================

# Informações gerais da documentação
name: "verbo"
title: "Documentação Oficial da Linguagem Verbo"
description: "A linguagem de programação transpilada para Go baseada na gramática da norma culta do Português Brasileiro."
author: "Juan / Projeto Crom"
language: "pt-BR"

# Diretório raiz dos arquivos markdown e estrutura principal
root: "./docs"
structure:
  readme: "README.md"
  summary: "SUMMARY.md"

# Versão do GitBook
gitbook: "5.x.x"

# Configuração de temas e estilos visuais
theme:
  colors:
    primary: "#009739"    # Verde Brasil
    secondary: "#FFDF00"  # Amarelo Ouro
    highlight: "#00ff88"  # Verde Neon

# Plugins recomendados para renderização
plugins:
  - prism                 # Realce de sintaxe com temas escuros
  - mermaid               # Diagramas de arquitetura e fluxogramas
  - search                # Motor de busca indexado
  - anchorjs              # Links de âncora nos títulos
  - copy-code-button      # Botão de copiar código em blocos

# Links externos e repositório
links:
  sidebar:
    "Repositório GitHub": "https://github.com/MrJc01/crom-verbo"
    "Portal Oficial": "https://verbo.dev"

