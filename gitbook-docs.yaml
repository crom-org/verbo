# ==============================================================================
# GitBook Documentation Configuration — Linguagem Verbo
# ==============================================================================
# Formato: sites-first (GitBook 5.x+)
# Documentação oficial da linguagem Verbo
# ==============================================================================

site:
  title: "Linguagem Verbo"
  description: "A linguagem de programação transpilada para Go baseada na gramática da norma culta do Português Brasileiro."
  author: "Crom"
  language: "pt-BR"

# Diretório raiz dos arquivos markdown e estrutura principal
root: "./docs"
structure:
  readme: "README.md"
  summary: "SUMMARY.md"

# Versão do GitBook
gitbook: "5.x.x"

# Configuração de temas e estilos visuais
theme:
  colors:
    primary: "#009739"
    secondary: "#FFDF00"
    highlight: "#00ff88"

# Plugins recomendados para renderização
plugins:
  - prism
  - mermaid
  - search
  - anchorjs
  - copy-code-button

# Links externos e repositório
links:
  sidebar:
    "Repositório GitHub": "https://github.com/crom-org/verbo"
